name: Build Video Call Vplus

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME"

      - name: Build root TinyALSA mixer helper
        run: |
          rm -rf build/native-mixer app/src/main/jniLibs
          mkdir -p build/native-mixer app/src/main/jniLibs/arm64-v8a
          cmake -S app/src/main/cpp -B build/native-mixer \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-mixer --target vplus_mixer_tool --parallel
          cp app/build/generated/mixer-bin/arm64-v8a/vplus_mixer_tool app/src/main/jniLibs/arm64-v8a/libvplus_mixer_tool.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libvplus_mixer_tool.so
          file app/src/main/jniLibs/arm64-v8a/libvplus_mixer_tool.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: video-call-vplus-debug
          path: app/build/outputs/apk/debug/app-debug.apk
